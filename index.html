</head><body><style>
/* Layout: кобальт түн аспаны, алтын ою жолағы; бастапқы экран екі үлкен 3D батырма, әрі қарай екі бөлім */
:root{color-scheme:dark;
--night:#0a1440;--deep:#101f63;--panel:#16297c;--line:#3450b8;--gold:#ffc53d;--gold2:#e8920c;
--cyan:#2fe0e6;--pink:#ff5d8f;--text:#f5f7ff;--muted:#b9c5f2;
--display:"Unbounded","Golos Text","Segoe UI",sans-serif;--body:"Golos Text","Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1100px 620px at 82% -8%,#2746d8 0,transparent 62%),radial-gradient(800px 520px at 0 8%,#0d7f97 0,transparent 60%),var(--night);background-attachment:fixed;color:var(--text);font:400 16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{height:44px;background-repeat:repeat-x;background-position:center;background-size:58px 44px;opacity:.9}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:32px;align-items:center;padding-block:44px 28px}
.eyebrow{margin:0 0 12px;color:var(--cyan);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
h1{margin:0;font:800 clamp(38px,7.2vw,82px)/1.04 var(--display);text-wrap:balance;background:linear-gradient(180deg,#fff3c4 8%,var(--gold) 52%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #7a3f00)}
.lead{max-width:34em;margin:18px 0 0;font-size:clamp(17px,2.2vw,20px);color:var(--muted)}
.teacher{display:grid;gap:2px;max-width:34em;margin-top:22px;padding:14px 18px;border-radius:14px;background:#16297ccc;border:2px solid var(--gold)}
.teacher small{color:var(--cyan);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.teacher strong{font:800 clamp(18px,2.4vw,23px)/1.25 var(--display)}
.teacher span{color:var(--muted)}
.atom{position:relative;width:min(100%,320px);aspect-ratio:1;margin:auto;perspective:900px}
.atom i{position:absolute;inset:6%;border-radius:50%;border:5px solid var(--gold);box-shadow:0 0 24px #ffc53d88,inset 0 0 18px #ffc53d55;transform-style:preserve-3d}
.atom i:nth-child(1){transform:rotateX(72deg) rotateZ(0)}
.atom i:nth-child(2){transform:rotateX(72deg) rotateY(60deg);border-color:var(--cyan);box-shadow:0 0 24px #2fe0e688}
.atom i:nth-child(3){transform:rotateX(72deg) rotateY(-60deg);border-color:var(--pink);box-shadow:0 0 24px #ff5d8f88}
.atom b{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff6d6,var(--gold) 38%,#c96a00 78%,#7a3f00);box-shadow:0 18px 34px #0008}
.atom svg{position:absolute;inset:0;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding-block:8px 34px}
.door{display:grid;gap:6px;text-align:left;padding:24px 26px;border:0;border-radius:22px;cursor:pointer;font:inherit;color:#10195a;background:linear-gradient(160deg,#fff0b8,var(--gold) 55%,var(--gold2));box-shadow:0 9px 0 #8c4c00,0 22px 34px #0007;transition:transform .12s,box-shadow .12s}
.door.alt{color:#04282e;background:linear-gradient(160deg,#c9fbfb,var(--cyan) 55%,#0ea4b5);box-shadow:0 9px 0 #06606c,0 22px 34px #0007}
.door:hover{transform:translateY(-3px)}
.door:active{transform:translateY(7px);box-shadow:0 2px 0 #8c4c00}
.door.alt:active{box-shadow:0 2px 0 #06606c}
.door[aria-pressed="true"]{outline:4px solid #fff;outline-offset:3px}
.door strong{font:800 clamp(21px,3.4vw,32px)/1.15 var(--display)}
.door span{font-weight:500}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;gap:12px;padding-block:14px;background:#0a1440f2;border-block:1px solid var(--line)}
.search{width:100%;padding:13px 16px;border-radius:12px;border:2px solid var(--line);background:var(--deep);color:var(--text);font:inherit}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--text);font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#10195a}
section{padding-block:18px 56px}
h2{margin:30px 0 14px;font:800 clamp(20px,2.8vw,26px)/1.25 var(--display);color:var(--gold);text-wrap:balance}
.count{font:600 15px var(--body);color:var(--muted);margin-left:8px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:15px 18px;background:var(--deep);border:1px solid var(--line);border-radius:14px}
.row p{margin:0;font-weight:600;font-size:17px;min-width:0}
.dl{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;background:linear-gradient(180deg,#ffdc7a,var(--gold));box-shadow:0 4px 0 #8c4c00;color:#10195a;font-weight:700;text-decoration:none;white-space:nowrap}
.dl:hover{filter:brightness(1.08)}
.dl:active{transform:translateY(3px);box-shadow:0 1px 0 #8c4c00}
.dl svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:14px}
.card{display:grid;grid-template-rows:auto 1fr;background:var(--deep);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;transition:transform .14s,border-color .14s}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.thumb{position:relative;aspect-ratio:3/4;max-width:100%;background:linear-gradient(150deg,#2746d8,#0d7f97);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:58%;opacity:.55}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.meta{padding:12px 14px 14px;display:grid;gap:4px;align-content:start}
.meta small{color:var(--cyan);font-weight:600;letter-spacing:.03em}
.meta strong{font-weight:600;line-height:1.3}
.none{padding:30px 0;color:var(--muted)}
footer{padding-block:0 30px;color:var(--muted);font-size:14px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding-block:28px 16px}.atom{width:200px;grid-row:1}.doors{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:minmax(0,1fr)}.dl{justify-self:start}}
@media (prefers-reduced-motion:reduce){.atom svg{animation:none}html{scroll-behavior:auto}.door,.card{transition:none}}
</style>

<script>
const D=JSON.parse(document.getElementById('d').textContent),$=s=>document.querySelector(s);
const OTHER='Қосымша материалдар',names=[...D.M,OTHER];
let view=null,mod=-1,q='';
const hornBg="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 88 74"><path d="M0 40C0 18 18 6 34 12c12 5 14 22 3 27-8 3-15-4-12-11M80 40C80 18 62 6 46 12c-12 5-14 22-3 27 8 3 15-4 12-11M40 40V70" fill="none" stroke="#ffc53d" stroke-width="6" stroke-linecap="round"/></svg>');
document.querySelectorAll('.band').forEach(b=>b.style.backgroundImage=`url("${hornBg}")`);
$('#n-k').textContent=D.K.length+' сабақ жоспары, Word форматында';
$('#n-m').textContent=D.P.length+' иллюстрация мен жұмыс парағы';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const low=s=>s.toLocaleLowerCase('kk');
function chips(){const used=view==='ksp'?D.M.length:names.length;
$('#chips').innerHTML=[-1,...Array(used).keys()].map(i=>`<button type="button" class="chip" data-m="${i}" aria-pressed="${i===mod}">${esc(i<0?'Барлығы':names[i])}</button>`).join('')}
function draw(){const list=(view==='ksp'?D.K:D.P).filter(x=>(mod<0||x[0]===mod)&&low(x[1]).includes(low(q)));
if(!list.length){$('#out').innerHTML='<p class="none">Ештеңе табылмады. Басқа сөзбен іздеп көріңіз.</p>';return}
let h='';names.forEach((n,i)=>{const g=list.filter(x=>x[0]===i);if(!g.length)return;
h+=`<h2>${esc(n)}<span class="count">${g.length}</span></h2>`;
if(view==='ksp')h+='<div class="rows">'+g.map(x=>`<div class="row"><p>${esc(x[1])}</p><a class="dl" href="https://drive.google.com/uc?export=download&id=${x[2]}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#down"/></svg>Word жүктеу</a></div>`).join('')+'</div>';
else h+='<div class="grid">'+g.map(x=>`<a class="card" href="https://drive.google.com/file/d/${x[3]}/view" target="_blank" rel="noopener"><div class="thumb"><svg aria-hidden="true"><use href="#horn"/></svg><img loading="lazy" alt="${esc(x[1])}" src="https://drive.google.com/thumbnail?id=${x[3]}&sz=w640" onerror="this.remove()"></div><div class="meta"><small>${esc(x[2])}</small><strong>${esc(x[1])}</strong></div></a>`).join('')+'</div>'});
$('#out').innerHTML=h}
function open(v,scroll){view=v;mod=-1;$('#main').hidden=false;
$('#go-ksp').setAttribute('aria-pressed',v==='ksp');$('#go-mat').setAttribute('aria-pressed',v==='materials');
chips();draw();if(scroll)$('#main').scrollIntoView();try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}}
$('#go-ksp').onclick=()=>open('ksp',1);$('#go-mat').onclick=()=>open('materials',1);
$('#q').oninput=e=>{q=e.target.value.trim();draw()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;mod=+b.dataset.m;chips();draw()};
const h=location.hash.slice(1);if(h==='ksp'||h==='materials')open(h,0);
</script>
